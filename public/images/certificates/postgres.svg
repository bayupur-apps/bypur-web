<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="pgCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <radialGradient id="pgGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Badge Glow -->
  <circle cx="200" cy="180" r="140" fill="url(#pgGlow)"/>

  <!-- Badge Circle Ring -->
  <circle cx="200" cy="170" r="110" fill="#151A28" stroke="url(#pgCyan)" stroke-width="3.5"/>
  <circle cx="200" cy="170" r="98" fill="none" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>

  <!-- Elephant Icon Motifs -->
  <g transform="translate(145, 112)">
    <!-- Head / Trunk outline -->
    <path d="M55,15 C85,15 95,40 95,65 C95,90 85,95 75,95 C65,95 62,80 62,70 C62,60 55,55 45,55 C35,55 25,65 25,75 C25,85 15,85 15,75 C15,50 30,15 55,15 Z" fill="#1E293B" stroke="url(#pgCyan)" stroke-width="3"/>
    <!-- Ear curve -->
    <path d="M45,25 C30,35 30,55 45,65" fill="none" stroke="#38BDF8" stroke-width="3"/>
    <!-- Eye -->
    <circle cx="70" cy="40" r="3" fill="#F59E0B"/>
    <!-- Tusk -->
    <path d="M78,65 Q88,75 92,60" fill="none" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="200" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#38BDF8" text-anchor="middle" letter-spacing="2">ENTERPRISEDB &amp; POSTGRES</text>
  <text x="200" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#F8FAFC" text-anchor="middle">ADVANCED POSTGRESQL DBA</text>
  <text x="200" y="286" font-family="monospace" font-size="9" font-weight="700" fill="#F59E0B" text-anchor="middle" letter-spacing="1">PERFORMANCE &amp; REPLICATION</text>

  <!-- Bottom Verification Pill -->
  <rect x="120" y="340" width="160" height="26" rx="13" fill="#151A28" stroke="rgba(56,189,248,0.4)" stroke-width="1.2"/>
  <circle cx="135" cy="353" r="3.5" fill="#10B981"/>
  <text x="205" y="357" font-family="monospace" font-size="9" font-weight="600" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">LIFETIME VALIDITY</text>
</svg>
