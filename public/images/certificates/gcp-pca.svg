<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gcpBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <radialGradient id="gcpGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Badge Glow -->
  <circle cx="200" cy="180" r="140" fill="url(#gcpGlow)"/>

  <!-- Google Cloud Badge Outer Shield -->
  <polygon points="200,45 315,100 315,230 200,315 85,230 85,100" fill="#161B28" stroke="url(#gcpBlue)" stroke-width="3.5" stroke-linejoin="round"/>
  <polygon points="200,56 303,106 303,222 200,298 97,222 97,106" fill="none" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>

  <!-- Cloud Symbol -->
  <g transform="translate(130, 95)">
    <path d="M110,65 C110,48 95,35 77,35 C74,35 71,36 68,37 C61,24 47,15 30,15 C9,15 -8,32 -8,53 C-8,55 -8,57 -7,59 C-20,64 -30,76 -30,90 C-30,108 -14,122 5,122 L110,122 C125,122 138,110 138,95 C138,80 126,67 110,65 Z" fill="#1E2536" stroke="url(#gcpBlue)" stroke-width="2"/>
    <!-- Quad Color Arc Accent -->
    <path d="M20,60 A25,25 0 0,1 60,60" fill="none" stroke="#EA4335" stroke-width="4" stroke-linecap="round"/>
    <path d="M60,60 A25,25 0 0,1 90,75" fill="none" stroke="#4285F4" stroke-width="4" stroke-linecap="round"/>
    <path d="M90,75 A25,25 0 0,1 80,105" fill="none" stroke="#34A853" stroke-width="4" stroke-linecap="round"/>
    <path d="M80,105 A25,25 0 0,1 30,105" fill="none" stroke="#FBBC04" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="200" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#60A5FA" text-anchor="middle" letter-spacing="2">GOOGLE CLOUD</text>
  <text x="200" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#F1F5F9" text-anchor="middle">PROFESSIONAL CLOUD</text>
  <text x="200" y="291" font-family="monospace" font-size="10" font-weight="700" fill="#F59E0B" text-anchor="middle" letter-spacing="1">ARCHITECT</text>

  <!-- Bottom Verification Pill -->
  <rect x="115" y="340" width="170" height="26" rx="13" fill="#161B28" stroke="rgba(96,165,250,0.4)" stroke-width="1.2"/>
  <circle cx="130" cy="353" r="3.5" fill="#10B981"/>
  <text x="203" y="357" font-family="monospace" font-size="9" font-weight="600" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">CERTIFIED ENGINEER</text>
</svg>
