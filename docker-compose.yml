version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.bypur.my.id/api/public}
        NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY}
        NEXT_PUBLIC_USE_BACKEND: ${NEXT_PUBLIC_USE_BACKEND:-true}
    image: bypur-portfolio:latest
    container_name: bypur-portfolio
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
    networks:
      - bypur-network

networks:
  bypur-network:
    name: bypur_network
    external: true
