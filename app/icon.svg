<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Squircle with Subtle Elevation -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Subtle Technical Schematic Border -->
  <rect x="6" y="6" width="116" height="116" rx="22" stroke="#0284C7" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
  
  <!-- Schematic Corner Alignment Markers -->
  <circle cx="16" cy="16" r="2" fill="#38BDF8" fill-opacity="0.8"/>
  <circle cx="112" cy="16" r="2" fill="#38BDF8" fill-opacity="0.8"/>
  <circle cx="16" cy="112" r="2" fill="#38BDF8" fill-opacity="0.8"/>
  <circle cx="112" cy="112" r="2" fill="#38BDF8" fill-opacity="0.8"/>

  <!-- Top Tech Indicator Pip -->
  <rect x="60" y="14" width="8" height="3" rx="1.5" fill="#38BDF8" fill-opacity="0.9"/>

  <!-- Modern Bold BP Monogram -->
  <text 
    x="64" 
    y="67" 
    font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" 
    font-size="48" 
    font-weight="800" 
    letter-spacing="-1.5"
    fill="url(#cyanGrad)"
    text-anchor="middle" 
    dominant-baseline="central"
  >BP</text>

  <!-- Bottom Terminal Status Bar -->
  <line x1="42" y1="98" x2="86" y2="98" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8"/>
  <circle cx="64" cy="98" r="2.5" fill="#38BDF8"/>
</svg>
